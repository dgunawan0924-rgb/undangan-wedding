<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password Admin — Danni & Riska</title>
<style>:root{--gold:#a6814d;--dark:#332c29;--cream:#f8f4ee;--line:#e8e1d8}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--dark);font:14px Arial,sans-serif}header{background:#fff;border-bottom:1px solid var(--line);padding:20px;text-align:center}h1{margin:0;color:var(--gold);font:32px Georgia,serif}main{max-width:460px;margin:44px auto;padding:0 16px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px}label{display:block;font-weight:bold;margin:14px 0 6px}input,button{font:inherit;padding:12px;border-radius:8px}input{width:100%;border:1px solid #d5cbbf}button{background:var(--gold);color:white;border:0;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.muted{color:#746c66;line-height:1.6}.notice{padding:12px;border-radius:8px;background:#f2ede5;white-space:pre-wrap}.error{background:#ffe9e9;color:#922}.ok{background:#e8f6ec;color:#185e32}.hidden{display:none!important}a{color:#8a673c}</style>
</head><body><header><h1>Danni &amp; Riska</h1><p>Pemulihan Password Administrator</p></header>
<main><section class="card"><h2>Buat Password Baru</h2>
<p id="status" class="notice" role="status" aria-live="polite">Memeriksa tautan pemulihan...</p>
<form id="resetForm" class="hidden">
<p class="muted">Tautan pemulihan telah diverifikasi. Buat password baru untuk akun Anda.</p>
<label for="newPassword">Password baru</label><input id="newPassword" type="password" required minlength="12" maxlength="128" autocomplete="new-password">
<label for="confirmPassword">Ulangi password baru</label><input id="confirmPassword" type="password" required minlength="12" maxlength="128" autocomplete="new-password">
<p class="muted">Minimal 12 karakter. Gunakan kombinasi huruf, angka, dan simbol yang sulit ditebak.</p>
<button type="submit" id="saveBtn">Simpan Password Baru</button></form>
<p><a href="./admin.html">Kembali ke Login Administrator</a></p>
</section></main>
<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
const SUPABASE_URL="https://itaphjltcgsrayxyzdoe.supabase.co";
const SUPABASE_KEY="sb_publishable_0xY4VXW6NB7CJKU1K6-lfw_Srq7bx0m";
const $=id=>document.getElementById(id);
const db=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{detectSessionInUrl:true}});
let recoveryVerified=false;
let completed=false;
function status(message,kind=""){const el=$("status");el.textContent=message;el.className="notice "+kind;}
function allowRecovery(){if(completed)return;recoveryVerified=true;$("resetForm").classList.remove("hidden");status("Tautan valid. Silakan masukkan password baru.","ok");}
const params=new URLSearchParams(location.search);
const fragment=new URLSearchParams(location.hash.replace(/^#/,""));
const hasRecoveryIndicator=fragment.get("type")==="recovery" || params.get("type")==="recovery" || (params.has("code") && !params.has("error"));
// Jangan izinkan sesi login biasa langsung membuka formulir reset.
const {data:{subscription}}=db.auth.onAuthStateChange((event)=>{
  if(event==="PASSWORD_RECOVERY")allowRecovery();
});
async function init(){
  try{
    if(params.has("error") || fragment.has("error")){
      status("Tautan pemulihan tidak berlaku atau kedaluwarsa. Minta tautan baru melalui halaman login.","error");return;
    }
    const {data,error}=await db.auth.getSession();
    if(error)throw error;
    if(!recoveryVerified && hasRecoveryIndicator && data.session)allowRecovery();
    if(!recoveryVerified)status("Tautan pemulihan belum terverifikasi atau sudah kedaluwarsa. Buka tautan terbaru dari email, atau minta ulang dari halaman login.","error");
  }catch(err){status("Gagal memverifikasi tautan: "+err.message,"error");}
}
$("resetForm").addEventListener("submit",async e=>{
 e.preventDefault();if(!recoveryVerified || completed)return;
 const pass=$("newPassword").value,confirm=$("confirmPassword").value;
 if(pass.length<12){status("Password minimal 12 karakter.","error");return;}
 if(pass!==confirm){status("Konfirmasi password tidak cocok.","error");return;}
 const btn=$("saveBtn");btn.disabled=true;
 try{
  const {error}=await db.auth.updateUser({password:pass});if(error)throw error;
  completed=true;recoveryVerified=false;$("resetForm").classList.add("hidden");
  $("newPassword").value="";$("confirmPassword").value="";
  status("Password berhasil diperbarui. Silakan login kembali menggunakan password baru.","ok");
  try{await db.auth.signOut();}catch(_){}
 }catch(err){status("Password belum berhasil diubah: "+err.message,"error");}
 finally{btn.disabled=false;}
});
init();
</script></body></html>
